<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>예약 문의함</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --lamp: #F7D44A; --ink: #15172A; --ink-2: #1D2036; --ink-3: #2B2F4C; --moon: #F2F1EC; --mist: #A9ACC2; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--ink); color: var(--moon); font-size: 16px; line-height: 1.5;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif;
      word-break: keep-all;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 24px; font-size: 22px; }
    :focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
    input, button { font: inherit; }
    .login { display: grid; gap: 12px; max-width: 360px; margin-top: 12vh; }
    .login label { font-weight: 600; }
    .login input { min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--ink-3); background: var(--ink-2); color: var(--moon); font-size: 18px; }
    .btn { min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--lamp); color: var(--ink); font-weight: 700; cursor: pointer; }
    .btn-line { background: transparent; color: var(--moon); border: 1px solid var(--ink-3); }
    .err { color: #FF8A80; min-height: 1.5em; margin: 0; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .count { font-size: 15px; color: var(--mist); }
    .count strong { display: block; font-size: 48px; line-height: 1.1; color: var(--lamp); }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .item { background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 20px; padding: 18px; display: grid; gap: 10px; }
    .item.is-new { border-color: var(--lamp); }
    .row1 { display: flex; justify-content: space-between; gap: 8px; color: var(--mist); font-size: 14px; }
    .name { font-size: 19px; font-weight: 700; margin: 0; }
    .stay { margin: 0; font-size: 17px; }
    .stay span { color: var(--mist); }
    .contact { justify-self: start; background: var(--ink-3); color: var(--moon); border: 0; border-radius: 12px; padding: 10px 14px; font-size: 16px; cursor: pointer; text-align: left; user-select: all; }
    .status { display: flex; gap: 6px; flex-wrap: wrap; }
    .status button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--ink-3); background: transparent; color: var(--moon); cursor: pointer; font-size: 15px; }
    .status button[aria-pressed="true"] { background: var(--lamp); color: var(--ink); border-color: var(--lamp); font-weight: 700; }
    .empty { color: var(--mist); }
  </style>
</head>
<body>
<main>
  <form class="login" id="login">
    <h1>예약 문의함</h1>
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="box" hidden>
    <div class="head">
      <p class="count">새 문의<strong id="new-count">0</strong></p>
      <div>
        <button class="btn btn-line" type="button" id="reload">새로고침</button>
        <button class="btn btn-line" type="button" id="logout">나가기</button>
      </div>
    </div>
    <p class="err" id="box-err" role="alert"></p>
    <ul class="list" id="list"></ul>
  </section>
</main>
<script>
(() => {
  const KEY = 'adminPw';
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ss = {
    get() { try { return sessionStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { sessionStorage.setItem(KEY, v); } catch {} },
    clear() { try { sessionStorage.removeItem(KEY); } catch {} },
  };
  let pw = ss.get();

  const call = (method, body) => fetch('/api/admin', {
    method, headers: { 'x-admin-password': pw || '', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });

  const when = (s) => new Date(s).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const day = (s) => { const [y, m, d] = String(s).split('-'); return `${Number(m)}월 ${Number(d)}일`; };
  const nights = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  function render(rows) {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    if (!rows.length) { $('list').innerHTML = '<li class="empty">아직 들어온 문의가 없어요.</li>'; return; }
    $('list').innerHTML = rows.map((r) => `
      <li class="item ${r.status === '새 문의' ? 'is-new' : ''}">
        <div class="row1"><span>${esc(when(r.created_at))}</span><span>${r.lang === 'en' ? '영어로 문의' : '한국어로 문의'}</span></div>
        <p class="name">${esc(r.name)}</p>
        <p class="stay">${esc(r.listing)}<br>${esc(day(r.check_in))} ~ ${esc(day(r.check_out))} <span>(${nights(r.check_in, r.check_out)}박)</span></p>
        <button class="contact" type="button" data-copy="${esc(r.contact)}" title="눌러서 복사">${esc(r.contact)}</button>
        <div class="status" role="group" aria-label="처리 상태">
          ${STATUSES.map((s) => `<button type="button" data-id="${r.id}" data-status="${s}" aria-pressed="${r.status === s}">${s}</button>`).join('')}
        </div>
      </li>`).join('');
  }

  async function load() {
    $('box-err').textContent = '';
    const r = await call('GET');
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin('비밀번호가 맞지 않아요.'); return false; }
    if (!r.ok) { $('box-err').textContent = data.error || '불러오지 못했어요.'; return true; }
    render(data.rows || []);
    return true;
  }

  function showLogin(msg) {
    ss.clear(); pw = null;
    $('box').hidden = true; $('login').hidden = false;
    $('login-err').textContent = msg || '';
    $('pw').value = ''; $('pw').focus();
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    pw = $('pw').value;
    $('login-err').textContent = '';
    $('login').hidden = true; $('box').hidden = false;
    if (await load()) ss.set(pw);
  });
  $('reload').addEventListener('click', load);
  $('logout').addEventListener('click', () => showLogin(''));

  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = '복사했어요'; setTimeout(() => { c.textContent = c.dataset.copy; }, 1200); }
      catch { const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(c); sel.removeAllRanges(); sel.addRange(rg); }
      return;
    }
    const b = e.target.closest('[data-status]');
    if (b && b.getAttribute('aria-pressed') !== 'true') {
      const r = await call('PATCH', { id: Number(b.dataset.id), status: b.dataset.status });
      if (r.status === 401) return showLogin('비밀번호가 맞지 않아요.');
      if (!r.ok) { $('box-err').textContent = (await r.json().catch(() => ({}))).error || '바꾸지 못했어요.'; return; }
      load();
    }
  });

  if (pw) { $('login').hidden = true; $('box').hidden = false; load(); } else { $('pw').focus(); }
})();
</script>
</body>
</html>
